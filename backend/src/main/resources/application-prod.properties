# ===== Perfil de produccion (SPRING_PROFILES_ACTIVE=prod) =====
# Sin valores por defecto: si falta una variable, la app no arranca en vez de usar datos de desarrollo.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# "update" crea las tablas la primera vez. Despues de tener el esquema estable, cambiar a "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ORIGINS}

# No exponer detalles internos en las respuestas de error
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
