# ===== Servidor =====
server.port=${PORT:8080}

# ===== Base de datos (PostgreSQL) =====
# Valores por defecto para desarrollo local; en produccion se sobreescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# ===== JPA / Hibernate =====
# "update" crea o ajusta las tablas automaticamente. El script database/schema.sql es equivalente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== JWT =====
# Clave en Base64 (minimo 32 bytes). CAMBIARLA en produccion con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dGFza2Zsb3ctY2xhdmUtZGUtZGVzYXJyb2xsby1jYW1iaWFyLWVuLXByb2R1Y2Npb24=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
# Origenes permitidos separados por coma (URL del frontend).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
